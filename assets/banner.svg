  <text x="64" y="194" font-family="'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="18" fill="#8b949e">Del modelo de datos a una interfaz clara · Lima, Perú</text>
  <g transform="translate(772 35)">
