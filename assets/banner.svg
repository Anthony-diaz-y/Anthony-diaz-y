<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Anthony Díaz — Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#0d1326"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#7c9cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .name{font:700 58px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#f3f5ff;letter-spacing:-1px}
      .role{font:600 22px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:url(#accent);letter-spacing:4px}
      .tag{font:400 18px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#aab3d1}
      .code{font:500 15px 'Cascadia Code',Consolas,'SFMono-Regular',monospace}
      .fade{opacity:0;animation:in .9s ease-out forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.9s}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .float{animation:float 6s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(64 0)">
    <text class="role fade d1" x="0" y="92">FULL STACK DEVELOPER</text>
    <text class="name fade d2" x="0" y="160">Anthony Díaz</text>
    <rect class="fade d3" x="2" y="182" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text class="tag fade d3" x="0" y="226">Del modelo de datos a una interfaz clara · Lima, Perú</text>
  </g>

  <!-- code card -->
  <g class="float">
    <g class="fade d4" transform="translate(760 52)">
      <rect width="380" height="196" rx="14" fill="#0a0f1e" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.1"/>
      <circle cx="22" cy="22" r="5" fill="#ff5f57"/>
      <circle cx="40" cy="22" r="5" fill="#febc2e"/>
      <circle cx="58" cy="22" r="5" fill="#28c840"/>
      <text class="code" x="24" y="66"><tspan fill="#a78bfa">const</tspan><tspan fill="#e6e9f5"> anthony = {</tspan></text>
      <text class="code" x="44" y="92"><tspan fill="#7c9cff">stack</tspan><tspan fill="#e6e9f5">: [</tspan><tspan fill="#2dd4bf">"Next.js"</tspan><tspan fill="#e6e9f5">, </tspan><tspan fill="#2dd4bf">"NestJS"</tspan><tspan fill="#e6e9f5">],</tspan></text>
      <text class="code" x="44" y="118"><tspan fill="#7c9cff">data</tspan><tspan fill="#e6e9f5">: </tspan><tspan fill="#2dd4bf">"PostgreSQL"</tspan><tspan fill="#e6e9f5">,</tspan></text>
      <text class="code" x="44" y="144"><tspan fill="#7c9cff">learning</tspan><tspan fill="#e6e9f5">: [</tspan><tspan fill="#2dd4bf">"Java"</tspan><tspan fill="#e6e9f5">, </tspan><tspan fill="#2dd4bf">"Go"</tspan><tspan fill="#e6e9f5">],</tspan></text>
      <text class="code" x="24" y="168"><tspan fill="#e6e9f5">};</tspan><tspan class="cursor" fill="#7c9cff"> ▍</tspan></text>
    </g>
  </g>
</svg>
