    <text x="24" y="64" class="code"><tspan fill="#8b949e">const</tspan><tspan fill="#e6edf3"> anthony = {</tspan></text><text x="44" y="90" class="code"><tspan fill="#c9d1d9">stack</tspan><tspan fill="#6e7681">: [</tspan><tspan fill="#a5b1bd">"Next.js"</tspan><tspan fill="#6e7681">, </tspan><tspan fill="#a5b1bd">"NestJS"</tspan><tspan fill="#6e7681">],</tspan></text><text x="44" y="116" class="code"><tspan fill="#c9d1d9">data</tspan><tspan fill="#6e7681">: </tspan><tspan fill="#a5b1bd">"PostgreSQL"</tspan><tspan fill="#6e7681">,</tspan></text><text x="44" y="142" class="code"><tspan fill="#c9d1d9">learning</tspan><tspan fill="#6e7681">: [</tspan><tspan fill="#a5b1bd">"Java"</tspan><tspan fill="#6e7681">, </tspan><tspan fill="#a5b1bd">"Go"</tspan><tspan fill="#6e7681">],</tspan></text><text x="24" y="166" class="code"><tspan fill="#e6edf3">};</tspan><tspan class="cursor" fill="#3fb950"> ▍</tspan></text>
