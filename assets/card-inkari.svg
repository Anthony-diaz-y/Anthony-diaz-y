<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="Inkari Café — E-commerce de café con panel administrativo.">
  <style>
      .h{font:600 22px 'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif;fill:#e6edf3;letter-spacing:-0.3px}
      .p{font:400 13px 'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif;fill:#8b949e}
      .m{font:400 11px 'Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;fill:#6e7681}
      .ms{font:500 11px 'Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;fill:#c9d1d9}
      .lbl{font:500 11px 'Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;fill:#c9d1d9}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.3}}
  </style>
  <rect x="0.5" y="0.5" width="479" height="269" rx="12" fill="#0d1117" stroke="#30363d"/>

  <text x="24" y="48" class="h">Inkari Café</text>
  <circle class="pulse" cx="452" cy="42" r="3.5" fill="#3fb950"/>
  <text x="442" y="46" text-anchor="end" class="m">en producción</text>
  <text x="24" y="72" class="p">E-commerce de café con panel administrativo.</text>
  <g><line x1="36" y1="140" x2="444" y2="140" stroke="#30363d" stroke-width="2"/><circle cx="36.0" cy="140" r="9" fill="#0d1117" stroke="#c9d1d9" stroke-width="2"/><circle cx="36.0" cy="140" r="3.5" fill="#c9d1d9"/><text x="27.0" y="170" text-anchor="start" class="lbl">carrito</text><circle cx="172.0" cy="140" r="9" fill="#0d1117" stroke="#c9d1d9" stroke-width="2"/><circle cx="172.0" cy="140" r="3.5" fill="#c9d1d9"/><text x="172.0" y="170" text-anchor="middle" class="lbl">pago</text><circle cx="308.0" cy="140" r="9" fill="#0d1117" stroke="#c9d1d9" stroke-width="2"/><circle cx="308.0" cy="140" r="3.5" fill="#c9d1d9"/><text x="308.0" y="170" text-anchor="middle" class="lbl">preparación</text><circle cx="444.0" cy="140" r="9" fill="#0d1117" stroke="#3fb950" stroke-width="2"/><circle cx="444.0" cy="140" r="3.5" fill="#3fb950"/><text x="453.0" y="170" text-anchor="end" class="lbl">envío</text><text x="24" y="204" class="m">+ panel admin · alertas operativas</text></g>
  <line x1="24" y1="226" x2="456" y2="226" stroke="#21262d"/>
  <text x="24" y="249" class="m">next.js · express · tailwind · postgres</text>
  <text x="456" y="249" text-anchor="end" class="ms">inkari.shop</text>
