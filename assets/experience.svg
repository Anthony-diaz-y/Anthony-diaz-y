<svg xmlns="http://www.w3.org/2000/svg" width="900" height="706" viewBox="0 0 900 706" role="img" aria-label="Experiencia profesional de Anthony Díaz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="0.6" stop-color="#111a33"/><stop offset="1" stop-color="#0d1326"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.95" cy="0" r="0.75">
      <stop offset="0" stop-color="#7c9cff" stop-opacity="0.28"/><stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff"/><stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="706" rx="16"/></clipPath>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#7c9cff"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0.2"/>
    </linearGradient>
    <style>
      .co{font:700 20px 'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif;fill:#f3f5ff;letter-spacing:-0.3px}
      .tg{font:600 9.5px 'Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;letter-spacing:1.2px}
      .pe{font:500 12.5px 'Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;fill:#aab3d1}
      .ro{font:600 15px 'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif;fill:#e3e7f7}
      .rp{font:400 11.5px 'Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;fill:#6f7a99}
      .hl{font:400 13.5px 'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif;fill:#8f99b8}
      .k{font:600 11px 'Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;letter-spacing:2px}
      .ed{font:400 13.5px 'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif;fill:#8f99b8}
            .pulse{animation:p 2.2s ease-in-out infinite}
      @keyframes p{50%{opacity:.15}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="706" fill="url(#bg)"/>
    <rect width="900" height="706" fill="url(#grid)"/>
    <rect width="900" height="706" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="705" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  <rect x="55" y="58" width="2" height="504" rx="1" fill="url(#rail)"/>
  <g class="f"><circle class="pulse" cx="56" cy="58" r="13" fill="#2dd4bf" fill-opacity="0.25"/><circle cx="56" cy="58" r="7" fill="#0b1020" stroke="#2dd4bf" stroke-width="2.5"/><circle cx="56" cy="58" r="2.5" fill="#2dd4bf"/><text x="86" y="64" class="co">Grupo CORIL</text><rect x="223.2" y="48" width="114.9" height="20" rx="10" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-opacity="0.3"/><text x="280.6" y="61.5" class="tg" fill="#2dd4bf" text-anchor="middle">SECTOR FINANCIERO</text><text x="860" y="64" class="pe" text-anchor="end">Ene 2026 — Actualidad</text><line x1="90" y1="80" x2="90" y2="126" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="90" cy="93" r="3.5" fill="#2dd4bf"/><text x="108" y="98" class="ro">Full Stack · Gestión de Patrimonios</text><text x="860" y="98" class="rp" text-anchor="end">Ago 2026 — hoy</text><text x="108" y="119" class="hl">Obligaciones, vencimientos y cumplimiento mensual; roles y permisos para contadores.</text><line x1="90" y1="134" x2="90" y2="180" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="90" cy="147" r="3.5" fill="#3b4566"/><text x="108" y="152" class="ro">Full Stack · Abonos Bancarios</text><text x="860" y="152" class="rp" text-anchor="end">Jun — Ago 2026</text><text x="108" y="173" class="hl">Carga y migración manual/automática de abonos; eliminé el registro manual.</text><line x1="90" y1="188" x2="90" y2="234" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="90" cy="201" r="3.5" fill="#3b4566"/><text x="108" y="206" class="ro">Full Stack · Gestión de Emisiones</text><text x="860" y="206" class="rp" text-anchor="end">Abr — Jun 2026</text><text x="108" y="227" class="hl">Servicios backend y vistas de reportes e indicadores con arquitectura por capas.</text><line x1="90" y1="242" x2="90" y2="264" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="90" cy="255" r="3.5" fill="#3b4566"/><text x="108" y="260" class="ro">Frontend · Intranet Corporativa</text><text x="860" y="260" class="rp" text-anchor="end">Ene — Abr 2026</text><text x="108" y="281" class="hl">Módulos reutilizables y responsive organizados por roles de usuario.</text></g><g class="f"><circle cx="56" cy="330" r="7" fill="#0b1020" stroke="#7c9cff" stroke-width="2.5"/><circle cx="56" cy="330" r="2.5" fill="#7c9cff"/><text x="86" y="336" class="co">CEM eLearning</text><rect x="245.6" y="320" width="52.2" height="20" rx="10" fill="#7c9cff" fill-opacity="0.1" stroke="#7c9cff" stroke-opacity="0.3"/><text x="271.7" y="333.5" class="tg" fill="#7c9cff" text-anchor="middle">EDTECH</text><text x="860" y="336" class="pe" text-anchor="end">Dic 2025 — Abr 2026</text><text x="86" y="370" class="ro">Desarrollador Full Stack</text><text x="86" y="391" class="hl">Modelé la base de datos relacional y la lógica académica con arquitectura modular.</text></g><g class="f"><circle cx="56" cy="440" r="7" fill="#0b1020" stroke="#7c9cff" stroke-width="2.5"/><circle cx="56" cy="440" r="2.5" fill="#7c9cff"/><text x="86" y="446" class="co">Comparapet</text><rect x="212.0" y="430" width="46.5" height="20" rx="10" fill="#7c9cff" fill-opacity="0.1" stroke="#7c9cff" stroke-opacity="0.3"/><text x="235.2" y="443.5" class="tg" fill="#7c9cff" text-anchor="middle">DATOS</text><text x="860" y="446" class="pe" text-anchor="end">Oct — Dic 2025</text><text x="86" y="480" class="ro">Base de Datos y Mejora Continua</text><text x="86" y="501" class="hl">Normalicé PostgreSQL y optimicé consultas: búsqueda de productos 2× más rápida.</text></g><g class="f"><circle cx="56" cy="550" r="7" fill="#0b1020" stroke="#7c9cff" stroke-width="2.5"/><circle cx="56" cy="550" r="2.5" fill="#7c9cff"/><text x="86" y="556" class="co">OpenLab</text><rect x="178.4" y="540" width="63.6" height="20" rx="10" fill="#7c9cff" fill-opacity="0.1" stroke="#7c9cff" stroke-opacity="0.3"/><text x="210.2" y="553.5" class="tg" fill="#7c9cff" text-anchor="middle">PRÁCTICA</text><text x="860" y="556" class="pe" text-anchor="end">Feb 2024 — Dic 2025</text><text x="86" y="590" class="ro">Pasante de Desarrollo Full Stack</text><text x="86" y="611" class="hl">Interfaces responsive, APIs y optimización de consultas PostgreSQL.</text></g>
  <line x1="40" y1="642" x2="860" y2="642" stroke="#ffffff" stroke-opacity="0.08"/><text x="40" y="672" class="k" fill="#7c9cff">FORMACIÓN</text><text x="150" y="672" class="ed"><tspan fill="#eef1ff" font-weight="600">Ingeniería Industrial</tspan> · Universidad Privada del Norte<tspan fill="#5d6785" dx="14">/</tspan><tspan dx="14" fill="#eef1ff" font-weight="600">Gestión de Sistemas de Información</tspan> · Zegel</text>
</svg>
