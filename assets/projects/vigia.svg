<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="Vigía">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="0.6" stop-color="#111a33"/><stop offset="1" stop-color="#0d1326"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.95" cy="0" r="0.75">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="480" height="300" rx="16"/></clipPath>
    <style>
      .k{font:600 11px 'Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;letter-spacing:2px}
      .t{font:700 30px 'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif;fill:#f3f5ff;letter-spacing:-0.5px}
      .desc{font:400 14.5px 'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif;fill:#aab3d1}
      .mv{font:700 19px 'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif;letter-spacing:-0.3px}
      .ml{font:400 11px 'Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;fill:#7f89a8}
      .chip{font:500 11px 'Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;fill:#cfd5ec}
      .st{font:600 10px 'Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace;letter-spacing:1px}
            .pulse{animation:p 2s ease-in-out infinite}
      @keyframes p{50%{opacity:.25}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="480" height="300" fill="url(#bg)"/>
    <rect width="480" height="300" fill="url(#grid)"/>
    <rect width="480" height="300" fill="url(#glow)"/>
    <rect width="480" height="3" fill="url(#bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="479" height="299" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g class="f d1">
    <text x="28" y="42" class="k" fill="#2dd4bf">02 <tspan fill="#5d6785">/</tspan> DATA · FORECASTING</text>
    <rect x="327.7" y="27" width="124.3" height="22" rx="11" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <circle class="pulse" cx="340.7" cy="38" r="3.5" fill="#2dd4bf"/>
    <text x="350.7" y="41.5" class="st" fill="#2dd4bf">EN DESARROLLO</text>
  </g>
  <g class="f d2">
    <text x="28" y="84" class="t">Vigía</text>
    <text x="28" y="116" class="desc">Ingesta, análisis y pronóstico de vigilancia</text><text x="28" y="137" class="desc">epidemiológica del Perú. Convierte CSV/XLSX</text><text x="28" y="158" class="desc">desordenados en datos validados y forecasts.</text>
  </g>
  <line x1="28" y1="184" x2="452" y2="184" stroke="#ffffff" stroke-opacity="0.08"/>
  <g class="f d3"><text x="28.0" y="214" class="mv" fill="#2dd4bf">CSV/XLSX</text><text x="28.0" y="233" class="ml">ingesta validada</text></g><g class="f d3"><text x="169.33333333333334" y="214" class="mv" fill="#eef1ff">zod</text><text x="169.33333333333334" y="233" class="ml">contratos tipados</text></g><g class="f d3"><text x="310.6666666666667" y="214" class="mv" fill="#eef1ff">monorepo</text><text x="310.6666666666667" y="233" class="ml">TypeScript e2e</text></g>
  <g class="f d4"><rect x="28" y="254" width="61.6" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/><text x="58.8" y="270" class="chip" text-anchor="middle">NestJS</text><rect x="97.6" y="254" width="68.2" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/><text x="131.7" y="270" class="chip" text-anchor="middle">Next.js</text><rect x="173.79999999999998" y="254" width="68.2" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/><text x="207.9" y="270" class="chip" text-anchor="middle">TypeORM</text><rect x="249.99999999999997" y="254" width="88.0" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/><text x="294.0" y="270" class="chip" text-anchor="middle">PostgreSQL</text>
    <text x="452" y="271" text-anchor="end" font-family="'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif" font-size="18" fill="#2dd4bf">↗</text>
  </g>
</svg>
